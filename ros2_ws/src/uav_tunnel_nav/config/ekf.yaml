ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    publish_tf: true
    map_frame: world
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /uav0/imu/reframed
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  true, true, true]
    imu0_remove_gravitational_acceleration: true

    odom0: /uav0/vio/odom
    odom0_config: [true, true, true,
                   false, false, false,
                   true, true, true,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 5

    pose0: /uav0/baro/pose
    pose0_config: [false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_queue_size: 5

    pose1: /uav0/mag/yaw
    pose1_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose1_queue_size: 5
